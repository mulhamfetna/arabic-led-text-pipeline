<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة الإعلانات</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#272e38;
    --ink:#e6edf3; --dim:#8b949e; --led:#ff3b30; --accent:#2f81f7;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:16px; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  h1{font-size:17px; margin:0 0 14px; font-weight:600; letter-spacing:.01em}
  h1 small{display:block; font-size:12px; color:var(--dim); font-weight:400; margin-top:3px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px}
  label{display:block; font-size:12px; color:var(--dim); margin-bottom:6px}
  textarea,select,input[type=text]{
    width:100%; background:#0d1117; color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:11px; font-size:17px; font-family:inherit;
  }
  textarea{resize:vertical; min-height:64px; line-height:1.5}
  .row{display:flex; gap:12px}
  .row>div{flex:1}
  input[type=range]{width:100%; accent-color:var(--accent)}
  .val{float:left; color:var(--ink); font-variant-numeric:tabular-nums}
  button{
    width:100%; padding:14px; font-size:16px; font-weight:600; font-family:inherit;
    background:var(--accent); color:#fff; border:0; border-radius:10px; cursor:pointer;
  }
  button:active{opacity:.75}
  button:disabled{background:#30363d; color:var(--dim)}
  /* Preview scrolls rather than squeezing: a squeezed preview is a lying preview. */
  .screen{overflow-x:auto; background:#000; border-radius:8px; padding:10px; direction:ltr}
  canvas{display:block; image-rendering:pixelated}
  .status{font-size:12px; margin-top:10px; min-height:1.2em; color:var(--dim); text-align:center}
  .status.ok{color:#3fb950} .status.err{color:#f85149}
  .hint{font-size:11px; color:var(--dim); margin-top:8px; line-height:1.5}
</style>
</head>
<body>

<h1>لوحة الإعلانات العربية
  <small>اكتب النص ثم اضغط إرسال — <span id="dims">…</span></small>
</h1>

<div class="card">
  <label for="txt">النص</label>
  <textarea id="txt" placeholder="مرحبا">مرحبا</textarea>
</div>

<div class="card">
  <label>المعاينة <span class="val" id="fitnote"></span></label>
  <div class="screen"><canvas id="preview"></canvas></div>
  <div class="hint">هذه المعاينة مطابقة تماماً لما سيظهر على اللوحة، بكسل ببكسل.</div>
</div>

<div class="card">
  <div class="row">
    <div>
      <label>حجم الخط <span class="val" id="sizeval">8</span></label>
      <input type="range" id="size" min="5" max="16" value="8">
    </div>
    <div>
      <label>حد التحويل <span class="val" id="thval">128</span></label>
      <input type="range" id="th" min="60" max="200" value="128">
    </div>
  </div>
  <label for="font" style="margin-top:12px">الخط</label>
  <select id="font">
    <option value="system-ui, sans-serif">النظام</option>
    <option value="'Noto Naskh Arabic', serif">نسخ</option>
    <option value="'Amiri', serif">أميري</option>
    <option value="monospace">أحادي المسافة</option>
  </select>
</div>

<button id="send">إرسال إلى اللوحة</button>
<div class="status" id="status"></div>

<script>
(() => {
  "use strict";

  // Filled in from /panel so the page adapts to whatever cascade is attached.
  let W = 32, H = 8;
  const SS = 4;               // supersampling factor, mirrors the host pipeline

  const $ = id => document.getElementById(id);
  const txt = $("txt"), size = $("size"), th = $("th"), font = $("font");
  const preview = $("preview"), status = $("status");

  const off  = document.createElement("canvas");   // supersampled
  const flat = document.createElement("canvas");   // downsampled to panel size
  const octx = off.getContext("2d", {willReadFrequently:true});
  const fctx = flat.getContext("2d", {willReadFrequently:true});
  const pctx = preview.getContext("2d");

  let packed = null;

  /*
   * Renders the text and returns the packed 1-bit payload.
   *
   * The shaping — initial/medial/final forms and the لا / الله ligatures — is
   * done entirely by the browser's own text engine when it draws to canvas.
   * That is the whole trick: the phone already ships a complete Arabic layout
   * engine, so neither this page nor the firmware needs a font or HarfBuzz.
   */
  function render() {
    const px  = +size.value;
    const cut = +th.value;

    off.width = W * SS; off.height = H * SS;
    octx.fillStyle = "#000";
    octx.fillRect(0, 0, off.width, off.height);
    octx.fillStyle = "#fff";
    octx.font = `${px * SS}px ${font.value}`;
    octx.textBaseline = "middle";
    octx.direction = "rtl";
    octx.textAlign = "right";
    octx.fillText(txt.value, off.width - SS, off.height / 2);

    // Report overflow honestly rather than silently cropping.
    const measured = Math.ceil(octx.measureText(txt.value).width / SS);
    $("fitnote").textContent = measured > W ? `النص أطول من اللوحة (${measured}px)` : "";

    // Downsample: the browser's image smoothing does the box filter for us,
    // which is what preserves stroke shape at 8px before thresholding.
    flat.width = W; flat.height = H;
    fctx.imageSmoothingEnabled = true;
    fctx.clearRect(0, 0, W, H);
    fctx.drawImage(off, 0, 0, W, H);

    const px32 = fctx.getImageData(0, 0, W, H).data;
    const stride = Math.ceil(W / 8);
    const out = new Uint8Array(stride * H);

    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = (y * W + x) * 4;
        // Rec. 601 luma, then threshold. Same cutoff semantics as the firmware.
        const lum = 0.299*px32[i] + 0.587*px32[i+1] + 0.114*px32[i+2];
        if (lum >= cut) {
          // bit 7 of byte 0 is the top-left pixel — must match the wire format.
          out[y * stride + (x >> 3)] |= 0x80 >> (x & 7);
        }
      }
    }
    return out;
  }

  function draw(bits) {
    const stride = Math.ceil(W / 8);
    const dot = Math.max(4, Math.min(14, Math.floor((window.innerWidth - 60) / W)));
    preview.width  = W * dot;
    preview.height = H * dot;
    pctx.fillStyle = "#000";
    pctx.fillRect(0, 0, preview.width, preview.height);

    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const on = (bits[y * stride + (x >> 3)] >> (7 - (x & 7))) & 1;
        pctx.fillStyle = on ? "#ff3b30" : "#1a1a1a";
        pctx.beginPath();
        pctx.arc(x*dot + dot/2, y*dot + dot/2, dot*0.38, 0, 6.284);
        pctx.fill();
      }
    }
  }

  function update() {
    $("sizeval").textContent = size.value;
    $("thval").textContent   = th.value;
    packed = render();
    draw(packed);
  }

  async function send() {
    const btn = $("send");
    btn.disabled = true;
    status.className = "status";
    status.textContent = "جارٍ الإرسال…";
    try {
      const stride = Math.ceil(W / 8);
      const r = await fetch(`/frame?w=${stride}&h=${H}`, {
        method: "POST",
        headers: {"Content-Type": "application/octet-stream"},
        body: packed,
      });
      if (!r.ok) throw new Error(await r.text() || r.status);
      status.className = "status ok";
      status.textContent = "✓ تم العرض على اللوحة";
    } catch (e) {
      status.className = "status err";
      status.textContent = "فشل الإرسال: " + e.message;
    } finally {
      btn.disabled = false;
    }
  }

  ["input", "change"].forEach(ev => {
    [txt, size, th, font].forEach(el => el.addEventListener(ev, update));
  });
  $("send").addEventListener("click", send);
  window.addEventListener("resize", () => packed && draw(packed));

  fetch("/panel")
    .then(r => r.json())
    .then(p => { W = p.width; H = p.height; })
    .catch(() => {})           // keep the 32x8 default if the probe fails
    .finally(() => {
      $("dims").textContent = `${W}×${H}`;
      update();
    });
})();
</script>
</body>
</html>
