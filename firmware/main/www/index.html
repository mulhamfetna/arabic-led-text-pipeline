<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة الإعلانات</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#272e38;
    --ink:#e6edf3; --dim:#8b949e; --led:#ff3b30; --accent:#2f81f7;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:16px; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  h1{font-size:17px; margin:0 0 14px; font-weight:600; letter-spacing:.01em}
  h1 small{display:block; font-size:12px; color:var(--dim); font-weight:400; margin-top:3px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px}
  label{display:block; font-size:12px; color:var(--dim); margin-bottom:6px}
  textarea,select,input[type=text]{
    width:100%; background:#0d1117; color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:11px; font-size:17px; font-family:inherit;
  }
  textarea{resize:vertical; min-height:64px; line-height:1.5}
  .row{display:flex; gap:12px}
  .row>div{flex:1}
  input[type=range]{width:100%; accent-color:var(--accent)}
  .val{float:left; color:var(--ink); font-variant-numeric:tabular-nums}
  button{
    width:100%; padding:14px; font-size:16px; font-weight:600; font-family:inherit;
    background:var(--accent); color:#fff; border:0; border-radius:10px; cursor:pointer;
  }
  button:active{opacity:.75}
  button:disabled{background:#30363d; color:var(--dim)}
  /* Preview scrolls rather than squeezing: a squeezed preview is a lying preview. */
  .screen{overflow-x:auto; background:#000; border-radius:8px; padding:10px; direction:ltr}
  canvas{display:block; image-rendering:pixelated}
  .status{font-size:12px; margin-top:10px; min-height:1.2em; color:var(--dim); text-align:center}
  .status.ok{color:#3fb950} .status.err{color:#f85149}
  .hint{font-size:11px; color:var(--dim); margin-top:8px; line-height:1.5}
  .modes{display:flex; gap:10px}
  .mode{flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
        background:#0d1117; border:1px solid var(--line); border-radius:8px;
        padding:11px; font-size:15px; color:var(--ink); cursor:pointer; margin:0}
  .mode:has(input:checked){border-color:var(--accent); background:#12233d}
  .mode input{accent-color:var(--accent); margin:0}
</style>
</head>
<body>

<h1>لوحة الإعلانات العربية
  <small>اكتب النص ثم اضغط إرسال — <span id="dims">…</span></small>
</h1>

<div class="card">
  <label for="txt">النص</label>
  <textarea id="txt" placeholder="مرحبا">مرحبا</textarea>
</div>

<div class="card">
  <label>المعاينة <span class="val" id="fitnote"></span></label>
  <div class="screen"><canvas id="preview"></canvas></div>
  <div class="hint" id="prevhint">هذه المعاينة مطابقة تماماً لما سيظهر على اللوحة، بكسل ببكسل.</div>
</div>

<div class="card">
  <label>العرض</label>
  <div class="modes">
    <label class="mode"><input type="radio" name="mode" value="static" checked> ثابت</label>
    <label class="mode"><input type="radio" name="mode" value="scroll"> متحرك</label>
  </div>
  <div id="dirwrap" style="display:none; margin-top:12px">
    <label>اتجاه الحركة</label>
    <div class="modes">
      <label class="mode"><input type="radio" name="dir" value="rtl" checked> ← يمين (عربي)</label>
      <label class="mode"><input type="radio" name="dir" value="ltr"> يسار (لاتيني) →</label>
    </div>
    <div class="hint">النص العربي يبدأ من اليمين، لذا يتحرك نحو اليمين ليظهر بترتيب القراءة.</div>
  </div>
  <div id="speedwrap" style="display:none; margin-top:12px">
    <label>سرعة الحركة <span class="val"><span id="speedval">60</span> ms</span></label>
    <input type="range" id="speed" min="10" max="200" value="60">
  </div>

  <div class="row" style="margin-top:14px">
    <div>
      <label>حجم الخط <span class="val" id="sizeval">8</span></label>
      <input type="range" id="size" min="5" max="16" value="8">
    </div>
    <div>
      <label>سماكة الخط <span class="val" id="thval">128</span></label>
      <input type="range" id="th" min="60" max="200" value="128">
    </div>
  </div>
  <div class="hint">سماكة الخط تحدد متى تُعتبر النقطة الرمادية مضاءة: القيمة الأقل تعطي خطاً أعرض، والأعلى أرفع.</div>
  <label for="font" style="margin-top:12px">الخط</label>
  <select id="font">
    <option value="system-ui, sans-serif">النظام</option>
    <option value="'Noto Naskh Arabic', serif">نسخ</option>
    <option value="'Amiri', serif">أميري</option>
    <option value="monospace">أحادي المسافة</option>
  </select>
</div>

<button id="send">إرسال إلى اللوحة</button>
<div class="status" id="status"></div>

<script>
(() => {
  "use strict";

  // Filled in from /panel so the page adapts to whatever cascade is attached.
  let W = 32, H = 8;
  const SS = 4;               // supersampling factor, mirrors the host pipeline

  const $ = id => document.getElementById(id);
  const txt = $("txt"), size = $("size"), th = $("th"), font = $("font");
  const speed = $("speed");
  const mode = () => document.querySelector('input[name=mode]:checked').value;
  const preview = $("preview"), status = $("status");

  const off  = document.createElement("canvas");   // supersampled
  const flat = document.createElement("canvas");   // downsampled to panel size
  const octx = off.getContext("2d", {willReadFrequently:true});
  const fctx = flat.getContext("2d", {willReadFrequently:true});
  const pctx = preview.getContext("2d");

  let packed = null;
  let curW = 32;          // width of the frame actually produced
  let animTimer = null;   // preview scroll animation
  let animOffset = 0;

  /*
   * Renders the text and returns the packed 1-bit payload.
   *
   * The shaping — initial/medial/final forms and the لا / الله ligatures — is
   * done entirely by the browser's own text engine when it draws to canvas.
   * That is the whole trick: the phone already ships a complete Arabic layout
   * engine, so neither this page nor the firmware needs a font or HarfBuzz.
   */
  function render() {
    const px  = +size.value;
    const cut = +th.value;
    const scrolling = mode() === "scroll";

    /*
     * Static mode renders into exactly the panel. Scroll mode renders the
     * whole phrase at its natural width and sends it as ONE wide frame - the
     * firmware windows across it, so animation costs no further traffic.
     */
    let outW = W;
    if (scrolling) {
      const probe = document.createElement("canvas").getContext("2d");
      probe.font = `${px}px ${font.value}`;
      // Round up to a whole byte: the wire format packs 8 pixels per byte.
      outW = Math.max(W, Math.ceil((Math.ceil(probe.measureText(txt.value).width) + 2) / 8) * 8);
    }
    curW = outW;

    off.width = outW * SS; off.height = H * SS;
    octx.fillStyle = "#000";
    octx.fillRect(0, 0, off.width, off.height);
    octx.fillStyle = "#fff";
    octx.font = `${px * SS}px ${font.value}`;
    octx.textBaseline = "middle";
    octx.direction = "rtl";
    octx.textAlign = "right";
    octx.fillText(txt.value, off.width - SS, off.height / 2);

    const measured = Math.ceil(octx.measureText(txt.value).width / SS);
    $("fitnote").textContent =
      scrolling ? `${outW}px — يتحرك على اللوحة`
      : measured > W ? `النص أطول من اللوحة (${measured}px) — اختر «متحرك»`
      : "";

    // Downsample: the browser's image smoothing does the box filter for us,
    // which is what preserves stroke shape at 8px before thresholding.
    flat.width = outW; flat.height = H;
    fctx.imageSmoothingEnabled = true;
    fctx.clearRect(0, 0, outW, H);
    fctx.drawImage(off, 0, 0, outW, H);

    const px32 = fctx.getImageData(0, 0, outW, H).data;
    const stride = Math.ceil(outW / 8);
    const out = new Uint8Array(stride * H);

    for (let y = 0; y < H; y++) {
      for (let x = 0; x < outW; x++) {
        const i = (y * outW + x) * 4;
        // Rec. 601 luma, then threshold. Same cutoff semantics as the firmware.
        const lum = 0.299*px32[i] + 0.587*px32[i+1] + 0.114*px32[i+2];
        if (lum >= cut) {
          // bit 7 of byte 0 is the top-left pixel — must match the wire format.
          out[y * stride + (x >> 3)] |= 0x80 >> (x & 7);
        }
      }
    }
    return out;
  }

  /*
   * Draws `cols` panel columns starting at `offset` into the content.
   * Static mode passes the whole frame; scroll mode passes a panel-sized
   * window and steps `offset`, which is what makes the preview show the real
   * speed rather than a still image the operator has to imagine moving.
   */
  function draw(bits, cols, offset) {
    const stride = Math.ceil(curW / 8);
    const dot = Math.max(4, Math.min(14, Math.floor((window.innerWidth - 60) / cols)));
    preview.width  = cols * dot;
    preview.height = H * dot;
    pctx.fillStyle = "#000";
    pctx.fillRect(0, 0, preview.width, preview.height);

    for (let y = 0; y < H; y++) {
      for (let x = 0; x < cols; x++) {
        const sx = offset + x;
        const on = (sx >= 0 && sx < curW)
          ? (bits[y * stride + (sx >> 3)] >> (7 - (sx & 7))) & 1
          : 0;
        pctx.fillStyle = on ? "#ff3b30" : "#1a1a1a";
        pctx.beginPath();
        pctx.arc(x*dot + dot/2, y*dot + dot/2, dot*0.38, 0, 6.284);
        pctx.fill();
      }
    }
  }

  function stopAnim() {
    if (animTimer) { clearInterval(animTimer); animTimer = null; }
  }

  /*
   * Mirrors the firmware's display task exactly: same span, same blank gap,
   * same sign convention. If the preview and the panel ever disagree, one of
   * these two loops is wrong - and they are deliberately easy to compare.
   */
  function startAnim() {
    stopAnim();
    const span = curW + W;
    const rightward = document.querySelector('input[name=dir]:checked').value === "rtl";
    animOffset = 0;
    animTimer = setInterval(() => {
      draw(packed, W, animOffset - W);
      animOffset = rightward ? (animOffset - 1 + span) % span
                             : (animOffset + 1) % span;
    }, +speed.value);
  }

  function update() {
    $("sizeval").textContent  = size.value;
    $("thval").textContent    = th.value;
    $("speedval").textContent = speed.value;
    const scrolling = mode() === "scroll";
    $("speedwrap").style.display = scrolling ? "" : "none";
    $("dirwrap").style.display   = scrolling ? "" : "none";
    packed = render();
    if (mode() === "scroll") {
      $("prevhint").textContent = "المعاينة تعمل بنفس السرعة الحقيقية للوحة.";
      startAnim();
    } else {
      stopAnim();
      $("prevhint").textContent = "هذه المعاينة مطابقة تماماً لما سيظهر على اللوحة، بكسل ببكسل.";
      draw(packed, curW, 0);
    }
  }

  async function send() {
    const btn = $("send");
    btn.disabled = true;
    status.className = "status";
    status.textContent = "جارٍ الإرسال…";
    try {
      const stride = Math.ceil(curW / 8);
      const r = await fetch(
        `/frame?w=${stride}&h=${H}&mode=${mode()}&speed=${speed.value}`
        + `&dir=${document.querySelector('input[name=dir]:checked').value}`, {
        method: "POST",
        headers: {"Content-Type": "application/octet-stream"},
        body: packed,
      });
      if (!r.ok) throw new Error(await r.text() || r.status);
      status.className = "status ok";
      status.textContent = mode() === "scroll"
        ? "✓ يتحرك على اللوحة" : "✓ تم العرض على اللوحة";
    } catch (e) {
      status.className = "status err";
      status.textContent = "فشل الإرسال: " + e.message;
    } finally {
      btn.disabled = false;
    }
  }

  ["input", "change"].forEach(ev => {
    [txt, size, th, font, speed].forEach(el => el.addEventListener(ev, update));
    document.querySelectorAll('input[name=mode], input[name=dir]')
            .forEach(el => el.addEventListener(ev, update));
  });
  $("send").addEventListener("click", send);
  window.addEventListener("resize", update);

  fetch("/panel")
    .then(r => r.json())
    .then(p => { W = p.width; H = p.height; })
    .catch(() => {})           // keep the 32x8 default if the probe fails
    .finally(() => {
      $("dims").textContent = `${W}×${H}`;
      update();
    });
})();
</script>
</body>
</html>
