<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foundations — Arabic on LED matrices</title>
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Palette taken from the hardware itself.
   The unlit LED is dark maroon, not grey — a dead red diode still shows its
   die colour, and using grey is what makes fake LED graphics look fake.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  --pcb:      #0a0c0f;   /* unlit panel                       */
  --surface:  #12161b;   /* panel body, slightly lifted       */
  --rule:     #222a33;   /* silkscreen hairline               */
  --lit:      #ff2d20;   /* 625nm red, actually orange-red    */
  --lit-dim:  #a01a12;   /* half-drive                        */
  --unlit:    #3a1210;   /* dark die of an off LED            */
  --ink:      #e9e6e2;   /* silkscreen white, warm            */
  --muted:    #79848f;   /* component grey                    */
  --cool:     #6ea8fe;   /* reserved: code + protocol only    */

  --mono: "DejaVu Sans Mono", "SF Mono", "Cascadia Mono", "Consolas", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:var(--pcb); color:var(--ink); font-family:var(--sans);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}

/* ── deck ───────────────────────────────────────────────────────────────── */
.slide{
  position:fixed; inset:0; display:none;
  flex-direction:column; padding:clamp(28px,4.4vw,64px);
  opacity:0; transition:opacity .28s ease;
}
.slide.on{display:flex; opacity:1}
@media (prefers-reduced-motion:reduce){ .slide{transition:none} }

/* ── header: LED progress strip + eyebrow ───────────────────────────────── */
.top{display:flex; align-items:center; gap:18px; margin-bottom:clamp(20px,3.6vh,44px)}
.strip{display:flex; gap:5px}
.strip i{
  width:9px; height:9px; border-radius:50%; background:var(--unlit);
  display:block; transition:background .3s ease, box-shadow .3s ease;
}
.strip i.on{ background:var(--lit); box-shadow:0 0 7px rgba(255,45,32,.75) }
.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--muted);
}
.eyebrow b{color:var(--lit); font-weight:400}
.top .sect{margin-inline-start:auto; text-align:end}

/* ── type ───────────────────────────────────────────────────────────────── */
h1{
  font-family:var(--mono); font-weight:700;
  font-size:clamp(30px,5.6vw,68px); line-height:1.02;
  letter-spacing:-.025em; margin-bottom:.42em;
}
h2{
  font-family:var(--mono); font-weight:700;
  font-size:clamp(22px,3.5vw,40px); line-height:1.08;
  letter-spacing:-.02em; margin-bottom:.5em;
}
.lede{
  font-size:clamp(15px,1.85vw,23px); line-height:1.55; max-width:60ch;
  color:#c9c6c2;
}
.body{flex:1; display:flex; flex-direction:column; justify-content:center; min-height:0}
p{font-size:clamp(14px,1.55vw,19px); line-height:1.62; max-width:62ch; margin-bottom:.85em}
strong{color:var(--ink); font-weight:600}
em{color:var(--lit); font-style:normal; font-weight:600}
.small{font-size:clamp(12px,1.2vw,15px); color:var(--muted); line-height:1.55}

/* ── callout: the one thing to remember ─────────────────────────────────── */
.key{
  border-inline-start:3px solid var(--lit);
  padding:14px 0 14px 20px; margin:.6em 0;
  font-size:clamp(15px,1.75vw,21px); line-height:1.5; max-width:60ch;
}

/* ── figures ────────────────────────────────────────────────────────────── */
pre{
  font-family:var(--mono); font-size:clamp(10px,1.08vw,14.5px); line-height:1.5;
  background:var(--surface); border:1px solid var(--rule); border-radius:7px;
  padding:16px 18px; overflow:auto; color:#b9c4cf;
}
pre .hl{color:var(--lit)}
pre .c{color:var(--cool)}

table{border-collapse:collapse; width:100%; max-width:920px; font-size:clamp(12px,1.28vw,16px)}
th,td{border-bottom:1px solid var(--rule); padding:9px 14px; text-align:start; vertical-align:top}
th{
  font-family:var(--mono); font-size:11px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--muted); font-weight:400;
}
td:first-child{color:var(--ink); font-weight:500; white-space:nowrap}
tr:last-child td{border-bottom:0}

.cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:clamp(16px,2.4vw,34px); align-items:start}
.card{background:var(--surface); border:1px solid var(--rule); border-radius:9px; padding:18px 20px}
.card h3{font-family:var(--mono); font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--lit); font-weight:400; margin-bottom:9px}
.card p{font-size:clamp(13px,1.3vw,16px); margin:0; color:#bdbab6}

/* ── live 8x8 panel used as a teaching prop ─────────────────────────────── */
.panel{
  display:grid; grid-template-columns:repeat(8,1fr); gap:clamp(4px,.7vw,9px);
  background:var(--surface); border:1px solid var(--rule); border-radius:9px;
  padding:clamp(12px,1.5vw,20px); width:fit-content;
}
.panel b{
  width:clamp(13px,1.9vw,26px); height:clamp(13px,1.9vw,26px);
  border-radius:50%; background:var(--unlit); display:block;
}
.panel b.on{background:var(--lit); box-shadow:0 0 9px rgba(255,45,32,.6)}
.panel b.row{background:var(--lit-dim)}

.split{display:grid; grid-template-columns:1fr auto; gap:clamp(22px,4vw,60px); align-items:center}
@media (max-width:820px){ .split{grid-template-columns:1fr} .panel{margin-inline:auto} }

/* ── footer: slide number in the project's own 5x7 font ─────────────────── */
.foot{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-top:clamp(16px,2.4vh,32px)}
.foot .note{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
/* The signature: the page number drawn on an actual dot matrix, using the same
   glyph table the firmware uses. It has to be legible or it is just texture. */
#num{display:flex; gap:5px; align-items:flex-end}
#num .g{display:grid; grid-template-columns:repeat(5,1fr); grid-auto-rows:4px; gap:2px}
#num i{width:4px; height:4px; border-radius:50%; background:#241010; display:block}
#num i.on{background:var(--lit); box-shadow:0 0 4px rgba(255,45,32,.5)}

/* title slide */
.title h1{font-size:clamp(34px,7.4vw,92px); margin-bottom:.24em}
.title .sub{font-family:var(--mono); font-size:clamp(12px,1.5vw,18px); letter-spacing:.1em; color:var(--lit)}
.title .by{margin-top:auto; font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}

.hint{position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:#3d454e; pointer-events:none; transition:opacity .5s}
.hint.hide{opacity:0}
:focus-visible{outline:2px solid var(--lit); outline-offset:3px}

/* ─── print / PDF ──────────────────────────────────────────────────────────
   Every slide becomes one landscape page at 16:9 (13.333 x 7.5in), the same
   ratio as a projector. The deck hides inactive slides with display:none for
   on-screen use, so printing has to override that or the PDF is one page long.
   ───────────────────────────────────────────────────────────────────────── */
@media print{
  @page{ size:338.7mm 190.5mm; margin:0 }
  html,body{ width:100%; height:auto; overflow:visible; background:var(--pcb) }
  .hint{ display:none !important }
  .slide{
    position:relative !important; inset:auto !important;
    display:flex !important; opacity:1 !important;
    width:100%; height:190.5mm;
    break-after:page; page-break-after:always;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .slide:last-child{ break-after:auto; page-break-after:auto }
  /* Glows cost a lot of ink and add nothing on a printed page. */
  .strip i.on, .panel b.on, #num i.on{ box-shadow:none }
}
</style>
</head>
<body>

<div id="deck"></div>
<div class="hint" id="hint">← → or space to navigate</div>

<script>
"use strict";

/* The same 5x7 glyph table the firmware uses (font5x7.c), column-major with
   bit 0 at the top. The deck renders its own page number on a dot matrix,
   using the exact data that drives the panel. */
const F = {
  "0":[0x3E,0x51,0x49,0x45,0x3E], "1":[0x00,0x42,0x7F,0x40,0x00],
  "2":[0x42,0x61,0x51,0x49,0x46], "3":[0x21,0x41,0x45,0x4B,0x31],
  "4":[0x18,0x14,0x12,0x7F,0x10], "5":[0x27,0x45,0x45,0x45,0x39],
  "6":[0x3C,0x4A,0x49,0x49,0x30], "7":[0x01,0x71,0x09,0x05,0x03],
  "8":[0x36,0x49,0x49,0x49,0x36], "9":[0x06,0x49,0x49,0x29,0x1E],
  "/":[0x20,0x10,0x08,0x04,0x02], " ":[0,0,0,0,0],
};

function glyph(ch){
  const cols = F[ch] || F[" "];
  const g = document.createElement("div");
  g.className = "g";
  for (let row = 0; row < 7; row++)
    for (let col = 0; col < 5; col++){
      const i = document.createElement("i");
      if (cols[col] & (1 << row)) i.className = "on";
      g.appendChild(i);
    }
  return g;
}

/* 8x8 prop. `pat` is 8 strings of 8 chars: # lit, + half, . off */
function panel(pat){
  const p = document.createElement("div");
  p.className = "panel";
  pat.forEach(r => [...r].forEach(c => {
    const b = document.createElement("b");
    if (c === "#") b.className = "on";
    else if (c === "+") b.className = "row";
    p.appendChild(b);
  }));
  return p.outerHTML;
}

const SECTIONS = ["THE BOARD","THE MATRIX","REGISTERS","THE PROTOCOL","THE NETWORK","THE CODE"];

const S = [
/* 0 */ {sect:0, title:true, html:`
  <h1>Foundations</h1>
  <div class="sub">Arabic text on LED dot-matrix displays</div>
  <p class="lede" style="margin-top:1.4em">How the hardware works, from the wire up.
     No prior knowledge of registers, SPI or embedded toolchains assumed.</p>
  <div class="by">Mulham Fetna · ORCID 0009-0006-4432-798X</div>`},

/* 1 */ {sect:0, h:"Three pieces", html:`
  <p class="lede">You type on a phone. Letters appear on a sign. Nothing is installed, and no
     router or internet is involved.</p>
  <div class="cols" style="margin-top:1.6em">
    <div class="card"><h3>Phone</h3><p>Opens a web page. That is the entire app.</p></div>
    <div class="card"><h3>ESP32</h3><p>A few-dollar computer with WiFi built in.</p></div>
    <div class="card"><h3>LED matrix</h3><p>64 red LEDs in an 8×8 grid, plus a driver chip.</p></div>
  </div>`},

/* 2 */ {sect:0, h:"Five wires. That's all.", html:`
<pre>        ESP32                        MAX7219 MODULE
   ┌─────────────┐                  ┌──────────────────┐
   │  VIN  ───────┼──── <span class="hl">red</span> ────────▶│ VCC              │
   │  GND  ───────┼──── black ─────▶│ GND    64 LEDs   │
   │  GPIO13 ─────┼──── green ─────▶│ DIN    in an     │
   │  GPIO14 ─────┼──── blue ──────▶│ CLK    8 × 8     │
   │  GPIO27 ─────┼──── yellow ────▶│ CS     grid      │
   └─────────────┘                  └──────────────────┘</pre>`},

/* 3 */ {sect:0, h:"What each wire does", html:`
  <table>
    <tr><th>Wire</th><th>Name</th><th>Job</th></tr>
    <tr><td>VCC</td><td>Voltage</td><td>Power in — 5 volts to run the LEDs</td></tr>
    <tr><td>GND</td><td>Ground</td><td>The return path. Every circuit needs one</td></tr>
    <tr><td>DIN</td><td>Data In</td><td>The information itself, one bit at a time</td></tr>
    <tr><td>CLK</td><td>Clock</td><td>A metronome. Says <em>now</em> — read the bit</td></tr>
    <tr><td>CS</td><td>Chip Select</td><td>"I'm talking to you" / "message finished"</td></tr>
  </table>`},

/* 4 */ {sect:0, h:"Why a clock wire at all?", html:`
  <p>The data wire only carries a voltage — high or low. Send ten <code>1</code> bits and the wire
     simply sits high the whole time.</p>
  <div class="key">The receiver cannot tell whether that is three bits or ten. <em>Nothing in the
     signal marks where one bit ends.</em></div>
  <p>The clock solves it. Every tick, the receiver samples the data line once. Ten ticks, ten bits.</p>
  <p class="small">Like spelling a word aloud over a bad phone line — the letters are the data,
     saying "next… next… next…" is the clock.</p>`},

/* 5 */ {sect:0, h:"Ground is not optional", html:`
  <p>Voltage is always a <strong>difference</strong> between two points.</p>
  <div class="key">Saying "the data wire is at 3.3 V" means nothing unless both chips agree
     what <em>zero</em> is. The ground wire is that agreement.</div>
  <p>Without it the display behaves randomly rather than failing cleanly — which makes it one of
     the more confusing faults to diagnose.</p>`},

/* 6 */ {sect:0, h:"Why 5 V, not 3.3 V", html:`
  <p>The ESP32 runs internally at 3.3 V. The LED module wants 5 V.</p>
  <p>Red LEDs need roughly 1.8–2 V before they conduct at all, and the driver needs headroom above
     that. At 3.3 V the LEDs are dim — and the driver's idea of "this counts as a logic 1" may stop
     matching what the ESP32 outputs.</p>
  <div class="key">You get flicker and garbage rather than an honest failure.</div>
  <p class="small">The board's VIN pin passes through the 5 V arriving over USB, which is exactly
     what the module wants.</p>`},

/* 7 */ {sect:0, h:"One pin choice that matters", html:`
  <p>CS is on <strong>GPIO27</strong>, even though <strong>GPIO12</strong> sits physically closer.</p>
  <p>GPIO12 is a <em>strapping pin</em>. At power-up the ESP32 reads it to choose its internal flash
     voltage, and it must read LOW at that instant.</p>
  <div class="key">A wire holding it high at boot makes the chip pick the wrong flash voltage and
     <em>refuse to start</em>. The board looks dead, and nothing about the symptom points at wiring.</div>
  <p class="small">Worth internalising early: a few pins have special jobs during boot. Check the
     datasheet before choosing pins, not after.</p>`},

/* 8 */ {sect:1, h:"64 LEDs, 16 pins", html:`
  <div class="split">
    <div>
      <p>Controlling each LED individually would need 64 wires. The module has 16.</p>
      <p>Every LED sits where one <strong>row</strong> wire crosses one <strong>column</strong> wire.
         8 + 8 = <em>16 wires control 64 LEDs</em>.</p>
      <p class="small">An LED lights only when its row is driven high and its column pulled low.</p>
    </div>
    ${panel(["+#......","+.......","+.......","+.......","+.......","+.......","+.......","+......."])}
  </div>`},

/* 9 */ {sect:1, h:"But there's a catch", html:`
  <div class="split">
    <div>
      <p>Set rows 0 and 1 high, pull columns 3 and 6 low — and you light <strong>four</strong> LEDs,
         not two.</p>
      <div class="key">Rows and columns cannot be aimed <em>independently</em>. The grid always
         lights every intersection.</div>
    </div>
    ${panel(["...#..#.","...#..#.","........","........","........","........","........","........"])}
  </div>`},

/* 10 */ {sect:1, h:"Multiplexing", html:`
  <p>The fix: never light more than one row at a time.</p>
<pre>  time ──▶
  ┌─────────┬─────────┬─────────┬─────────┐
  │ <span class="hl">row 0</span>   │ <span class="hl">row 1</span>   │ <span class="hl">row 2</span>   │ <span class="hl">row 3</span>   │ … repeat
  │ columns │ columns │ columns │ columns │
  └─────────┴─────────┴─────────┴─────────┘
     1 ms      1 ms      1 ms      1 ms</pre>
  <p style="margin-top:1em">Light row 0 with its pattern. Off. Row 1 with <em>its</em> pattern.
     Through all eight, then start again.</p>`},

/* 11 */ {sect:1, h:"Persistence of vision", html:`
  <p>Each row is lit only <strong>⅛</strong> of the time. But repeat the cycle faster than about 50
     times a second and your eye cannot follow it.</p>
  <div class="key">The flashes blend into a steady image. <em>The same effect that makes film look
     like motion</em> rather than a sequence of stills.</div>
  <p class="small"><strong>The cost:</strong> every LED is off ⅞ of the time, so the panel is dimmer
     than if all LEDs ran continuously. Drivers compensate by pushing more current during each
     brief on-period.</p>`},

/* 12 */ {sect:2, h:"What a register is", html:`
  <p>A register is a small piece of memory <strong>inside a chip</strong> — not the
     microcontroller's RAM, but memory built into the peripheral itself.</p>
<pre>       bit  7   6   5   4   3   2   1   0
          ┌───┬───┬───┬───┬───┬───┬───┬───┐
          │ <span class="hl">1</span> │ 0 │ <span class="hl">1</span> │ <span class="hl">1</span> │ 0 │ 0 │ <span class="hl">1</span> │ 0 │
          └───┴───┴───┴───┴───┴───┴───┴───┘</pre>
  <div class="key" style="margin-top:1em">A row of switches that <em>stay where you put them</em>.
     In an LED driver, each bit is one LED.</div>`},

/* 13 */ {sect:2, h:"Why chips use registers", html:`
  <p>A chip must be told what to do — but a pin for every setting would make it enormous. So it
     exposes a few registers and one small serial connection.</p>
  <div class="key">Configuration becomes <em>"write this number to that register"</em> instead of
     "add another wire".</div>
  <table style="margin-top:.4em">
    <tr><th>Address</th><th>Job</th></tr>
    <tr><td>1</td><td>The 8 LEDs of row 0</td></tr>
    <tr><td>2</td><td>The 8 LEDs of row 1</td></tr>
    <tr><td>10</td><td>Brightness</td></tr>
    <tr><td>12</td><td>On / off</td></tr>
  </table>`},

/* 14 */ {sect:2, h:"The famous one: 74HC595", html:`
  <p>A <strong>shift register</strong> takes bits in one at a time and makes them available all at once.</p>
<pre>   DATA ──▶ ┌───┬───┬───┬───┬───┬───┬───┬───┐
            │ b7│ b6│ b5│ b4│ b3│ b2│ b1│ b0│
            └─┬─┴─┬─┴─┬─┴─┬─┴─┬─┴─┬─┴─┬─┴─┬─┘
              ▼   ▼   ▼   ▼   ▼   ▼   ▼   ▼
             <span class="hl">Q7  Q6  Q5  Q4  Q3  Q2  Q1  Q0</span></pre>
  <p style="margin-top:1em">Each clock tick pushes a bit in and shifts everything along — like people
     shuffling down a bench. After 8 ticks a <strong>latch</strong> pulse copies them to the pins.</p>`},

/* 15 */ {sect:2, h:"Why the latch matters", html:`
  <p>Without it, the outputs would flicker through garbage while the bits shuffle past.</p>
  <div class="key">The latch means the outputs change <em>only when you say the data is complete</em>.</div>
  <p><strong>Why this is useful:</strong> three pins — data, clock, latch — become eight outputs.
     Chain two chips and three pins become sixteen.</p>`},

/* 16 */ {sect:2, h:"What the 595 makes you add", html:`
  <p class="small" style="margin-bottom:1.2em">The 74HC595 is general-purpose. It knows nothing about LEDs.</p>
  <table>
    <tr><th>You must add</th><th>Why</th></tr>
    <tr><td>A resistor per LED</td><td>The 595 doesn't limit current — without them the LEDs burn out</td></tr>
    <tr><td>A second chip</td><td>One 595 drives 8 columns; rows need their own driver</td></tr>
    <tr><td>Transistors</td><td>A whole row draws more current than the chip can source</td></tr>
    <tr><td>Multiplexing code</td><td><em>Your</em> program must cycle the rows, fast, forever</td></tr>
    <tr><td>Brightness logic</td><td>Any dimming, you write yourself</td></tr>
  </table>`},

/* 17 */ {sect:2, h:"MAX7219: the same idea, specialised", html:`
<pre>   74HC595                        MAX7219
   ─────────                      ────────
   shift register          ─────▶ <span class="hl">shift register</span>
   you add resistors       ─────▶ <span class="hl">constant-current drivers built in</span>
   you add a row driver    ─────▶ <span class="hl">row driver built in</span>
   you write multiplexing  ─────▶ <span class="hl">multiplexing in hardware</span>
   you write dimming       ─────▶ <span class="hl">16 brightness levels</span>
   you track the state     ─────▶ <span class="hl">8 registers hold the image</span></pre>
  <div class="key" style="margin-top:1.1em">One resistor sets the current for all 64 LEDs.
     <em>Not 64 resistors — one.</em></div>`},

/* 18 */ {sect:2, h:"The one that actually matters", html:`
  <p>The MAX7219 cycles the rows <strong>itself</strong>, continuously, forever.</p>
  <div class="key">Your program is free the instant the data is sent. <em>The entire refresh burden
     disappears.</em></div>
  <p>With a 595, that multiplexing loop must run non-stop. A few milliseconds of delay anywhere else
     in your program shows up as visible flicker — your code is permanently responsible for the
     display, on top of whatever else it is meant to do.</p>`},

/* 19 */ {sect:2, h:"Which should you use?", html:`
  <table>
    <tr><th></th><th>74HC595</th><th>MAX7219</th></tr>
    <tr><td>Purpose</td><td>General shift register</td><td>LED matrix driver</td></tr>
    <tr><td>Resistors</td><td>One per LED</td><td>One, total</td></tr>
    <tr><td>Multiplexing</td><td>Your code, forever</td><td>Hardware</td></tr>
    <tr><td>Brightness</td><td>Your circuit</td><td>Built in, 16 levels</td></tr>
    <tr><td>Remembers image</td><td>No</td><td>Yes</td></tr>
    <tr><td>Chips for one 8×8</td><td>2+ and transistors</td><td>1</td></tr>
  </table>
  <div class="key" style="margin-top:1.2em">The 595 is the better <em>teaching</em> chip — it makes
     you do the work. The MAX7219 is the better <em>building</em> chip — you don't have to.</div>`},

/* 20 */ {sect:3, h:"SPI — three signals", html:`
<pre>   ESP32 (master)                      MAX7219 (slave)
        CLK  ─────┐ ┌─┐ ┌─┐ ┌─┐ ┌─┐──────▶  CLK
                  └─┘ └─┘ └─┘ └─┘
        DIN  ─────  <span class="hl">1   0   1   1</span>  ──────▶  DIN
        CS   ▔▔▔╲______________________╱▔▔  CS
                 └────── message ──────┘</pre>
  <p style="margin-top:1.1em"><strong>Serial</strong> means bits travel one after another on a single
     wire, rather than eight wires side by side.</p>`},

/* 21 */ {sect:3, h:"The MAX7219 has no way to answer", html:`
  <p>The <strong>master</strong> generates the clock and starts every exchange. Slaves only respond.</p>
  <div class="key">The MAX7219 has <em>no output wire at all</em>. It can never volunteer anything.</div>
  <p>That has a real consequence: you cannot ask the module how it is wired internally. There is no
     path for an answer.</p>
  <p class="small">Anything you need to know about it has to be found by trying something and
     looking at the panel.</p>`},

/* 22 */ {sect:3, h:"Sixteen bits per message", html:`
<pre>   ┌────────────┬────────────┬─────────────────────┐
   │  4 bits    │  <span class="hl">4 bits</span>    │      <span class="c">8 bits</span>         │
   │  ignored   │  <span class="hl">register</span>  │       <span class="c">data</span>          │
   │            │  <span class="hl">address</span>   │                     │
   └────────────┴────────────┴─────────────────────┘</pre>
  <p style="margin-top:1.1em">Send <code>0x01, 0xFF</code> — <em>register 1, all eight bits on</em> —
     and the top row lights fully.</p>
  <p class="small">The 595 has no address field at all. The MAX7219 spends 4 bits on one so a single
     chip can hold several registers. That is the difference between a generic part and a
     specialised one, visible right in the wire format.</p>`},

/* 23 */ {sect:3, h:"Chaining surprises everyone", html:`
  <p>Bits shifted out of chip 1 flow into chip 2.</p>
  <div class="key">The word you send <em>first</em> ends up in the <em>last</em> chip of the chain.</div>
  <p>Everything you send travels through the earlier chips to reach the later ones, pushing previous
     data along ahead of it.</p>
  <p class="small">So when writing code for a chain, you send data in reverse order.</p>`},

/* 24 */ {sect:4, h:"How can an ESP32 serve a web page?", html:`
  <p>A web server is just <strong>a program that waits for a request and sends text back</strong>.
     That is the whole job.</p>
<pre>  browser ──▶  <span class="c">GET / HTTP/1.1</span>
  server  ──▶  <span class="hl">&lt;!doctype html&gt; …</span></pre>
  <div class="key" style="margin-top:1.1em">Nothing about that requires a big computer.
     <em>A few hundred lines, and the ESP32 has room to spare.</em></div>`},

/* 25 */ {sect:4, h:"The layers", html:`
<pre>   ┌────────────────────────────────────────┐
   │  <span class="hl">Your HTML page</span>  (stored in flash)    │ ← you write this
   ├────────────────────────────────────────┤
   │  HTTP server   — understands GET/POST  │ ← library
   ├────────────────────────────────────────┤
   │  TCP/IP stack  — addresses, packets    │ ← library
   ├────────────────────────────────────────┤
   │  WiFi driver   — radio, 802.11         │ ← chip + library
   ├────────────────────────────────────────┤
   │  WiFi radio hardware                   │ ← silicon
   └────────────────────────────────────────┘</pre>
  <p class="small" style="margin-top:1em">You write the top layer. Everything beneath ships with the
     SDK — that is what "batteries included" means.</p>`},

/* 26 */ {sect:4, h:"Access Point mode", html:`
  <div class="cols">
    <div class="card"><h3>Station</h3><p>Joins an existing network. What your phone normally does.</p></div>
    <div class="card"><h3>Access Point</h3><p><em>Becomes</em> a network others join. What a router does.</p></div>
  </div>
  <div class="key" style="margin-top:1.4em">The ESP32 runs as an access point, so the phone joins it
     directly. <em>No router, no internet, no SIM.</em></div>
  <p class="small">A small DHCP server hands the phone an address — the same service your home
     router runs — and points it at the sign on 192.168.4.1.</p>`},

/* 27 */ {sect:5, h:"Arduino vs PlatformIO vs ESP-IDF", html:`
  <p class="lede" style="margin-bottom:1.3em">These three are constantly confused, because they are
     not the same <em>kind</em> of thing.</p>
  <div class="cols">
    <div class="card"><h3>Arduino</h3><p>A <strong>framework</strong> — simplified functions,
      <code>setup()</code> and <code>loop()</code>.</p></div>
    <div class="card"><h3>ESP-IDF</h3><p>A <strong>framework</strong> — Espressif's official SDK,
      the one Arduino-for-ESP32 is built on.</p></div>
    <div class="card"><h3>PlatformIO</h3><p>A <strong>build tool</strong> — not a framework.
      It builds <em>either</em> of the other two.</p></div>
  </div>
  <div class="key" style="margin-top:1.4em">"Arduino vs ESP-IDF" is a real choice.
     <em>"PlatformIO vs ESP-IDF" is a category error.</em></div>`},

/* 28 */ {sect:5, h:"Why this project uses ESP-IDF", html:`
  <table>
    <tr><th>Requirement</th><th>Why ESP-IDF</th></tr>
    <tr><td>AP + DHCP + HTTP server</td><td>All included, properly integrated</td></tr>
    <tr><td>Scroll <em>while</em> serving pages</td><td>FreeRTOS tasks make it straightforward</td></tr>
    <tr><td>Change pins without editing code</td><td><code>menuconfig</code></td></tr>
    <tr><td>Precise SPI and timing control</td><td>Direct access to the drivers</td></tr>
  </table>
  <p class="small" style="margin-top:1.3em">With Arduino most of this is possible but fought for.
     With ESP-IDF it is what the SDK is <em>for</em>.</p>`},

/* 29 */ {sect:5, h:"Installing and running it", html:`
<pre>  <span class="c"># download the SDK — --recursive matters</span>
  git clone -b v5.3.2 <span class="hl">--recursive</span> https://github.com/espressif/esp-idf.git
  cd esp-idf && ./install.sh esp32

  <span class="c"># activate — needed in EVERY new terminal</span>
  . ./export.sh

  <span class="c"># the everyday command</span>
  idf.py -p /dev/ttyUSB0 <span class="hl">flash monitor</span></pre>
  <p class="small" style="margin-top:1.1em"><strong>Without <code>--recursive</code></strong> you get
     an incomplete SDK and a confusing build failure. <strong>Forgetting <code>export.sh</code></strong>
     gives <code>idf.py: command not found</code> — that is all it ever means.</p>`},

/* 30 */ {sect:5, h:"How the code is organised", html:`
  <div class="cols">
    <div class="card"><h3>Includes</h3><p>Bringing in code someone else wrote.
      <code>&lt;…&gt;</code> is a system library, <code>"…"</code> is ours.</p></div>
    <div class="card"><h3>Functions</h3><p>Named blocks of work. What it returns, what it is called,
      what it takes.</p></div>
    <div class="card"><h3>Modules</h3><p>A <code>.h</code> + <code>.c</code> pair. The menu, and the
      kitchen.</p></div>
  </div>
  <div class="key" style="margin-top:1.4em">Split them so you can change <em>how</em> something works
     without anything else caring — as long as the menu stays the same.</div>`},

/* 31 */ {sect:5, h:"One job each", html:`
  <table>
    <tr><th>Module</th><th>Responsibility</th></tr>
    <tr><td>main</td><td>Startup and coordination</td></tr>
    <tr><td>max7219</td><td>Talking to the LED driver chip</td></tr>
    <tr><td>framebuffer</td><td>Storing the picture in memory</td></tr>
    <tr><td>wifi_ap</td><td>Creating the WiFi network</td></tr>
    <tr><td>http_ui</td><td>Serving the web page</td></tr>
    <tr><td>font5x7</td><td>Drawing Latin letters, for testing</td></tr>
  </table>
  <p class="small" style="margin-top:1.2em"><code>max7219.c</code> knows about the chip but nothing
     about WiFi. <code>wifi_ap.c</code> knows about networks but nothing about LEDs. That is
     deliberate — you can understand one file without holding the whole project in your head.</p>`},

/* 32 */ {sect:5, h:"Where the program starts", html:`
<pre>  void <span class="hl">app_main</span>(void)
  {
      max7219_init(...);      <span class="c">// 1. wake the display</span>
      fb_init(...);           <span class="c">// 2. room for a picture</span>
      wifi_ap_start(...);     <span class="c">// 3. create the network</span>
      http_ui_start(...);     <span class="c">// 4. serve the page</span>
  }</pre>
  <p style="margin-top:1.1em">Notice it does not loop forever. Under <strong>FreeRTOS</strong>, work
     happens in independent <em>tasks</em> the OS switches between.</p>
  <p class="small">That is exactly what would be painful in Arduino's single <code>loop()</code> —
     and the main reason this project uses ESP-IDF.</p>`},

/* 33 */ {sect:5, h:"The whole chain", html:`
<pre>  1. You type Arabic on your phone
  2. The page turns letters into a grid of on/off dots
  3. Dots are packed into bytes — <span class="hl">8 dots per byte</span>
  4. Sent over WiFi to the ESP32
  5. Stored in its framebuffer
  6. Sent over <span class="c">SPI</span> to the MAX7219 registers
  7. The chip multiplexes the rows continuously
  8. <span class="hl">Your eye blends the flashes into steady letters</span></pre>
  <p class="small" style="margin-top:1.2em">Every step above has now been explained: what a register
     is, how the matrix multiplexes, which protocol carries the bits, why the ESP32 can host a page,
     and how the code is arranged to do it.</p>`},
];

/* ── build ──────────────────────────────────────────────────────────────── */
const deck = document.getElementById("deck");
S.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide" + (s.title ? " title" : "");
  const strip = Array.from({length:6}, (_,k) =>
    `<i class="${k <= s.sect ? "on" : ""}"></i>`).join("");
  el.innerHTML = `
    <div class="top">
      <div class="strip">${strip}</div>
      <div class="eyebrow"><b>${String(s.sect+1).padStart(2,"0")}</b> ${SECTIONS[s.sect]}</div>
      <div class="eyebrow sect">Foundations</div>
    </div>
    <div class="body">${s.h ? `<h2>${s.h}</h2>` : ""}${s.html}</div>
    <div class="foot"><div class="note"></div><div id="n${i}"></div></div>`;
  deck.appendChild(el);

  const n = el.querySelector(`#n${i}`);
  n.id = ""; n.style.display = "flex"; n.style.gap = "3px";
  const label = `${String(i+1).padStart(2,"0")}/${String(S.length).padStart(2,"0")}`;
  const wrap = document.createElement("div");
  wrap.id = "num";
  [...label].forEach(ch => wrap.appendChild(glyph(ch)));
  n.appendChild(wrap);
});

let cur = 0;
const hint = document.getElementById("hint");
function show(i){
  cur = Math.max(0, Math.min(S.length - 1, i));
  [...deck.children].forEach((el, k) => el.classList.toggle("on", k === cur));
  location.hash = cur + 1;
}
addEventListener("keydown", e => {
  if (["ArrowRight","ArrowDown"," ","PageDown"].includes(e.key)) { show(cur+1); e.preventDefault(); }
  else if (["ArrowLeft","ArrowUp","PageUp"].includes(e.key))     { show(cur-1); e.preventDefault(); }
  else if (e.key === "Home") show(0);
  else if (e.key === "End")  show(S.length - 1);
  hint.classList.add("hide");
});
addEventListener("click", e => { if (!e.target.closest("a")) show(cur + 1); });
show(Math.max(0, (parseInt(location.hash.slice(1)) || 1) - 1));
setTimeout(() => hint.classList.add("hide"), 6000);
</script>
</body>
