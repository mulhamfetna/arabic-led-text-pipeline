<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" font-family="DejaVu Sans, Verdana, sans-serif">
  <style>
    .lbl   { font-size: 13px; fill: #1a1a1a; }
    .pin   { font-size: 11px; fill: #444; }
    .title { font-size: 19px; font-weight: bold; fill: #111; }
    .sub   { font-size: 12px; fill: #666; }
    .note  { font-size: 11px; fill: #8a5a00; }
    .wire  { stroke-width: 3.5; fill: none; stroke-linecap: round; }
  </style>

  <rect width="820" height="520" fill="#ffffff"/>

  <text x="24" y="32" class="title">MAX7219 → ESP32 DevKit — all five wires on the power-pin edge</text>
  <text x="24" y="52" class="sub">HSPI native pins. Confirm the labels printed on your board rather than counting positions.</text>

  <!-- ================= ESP32 board ================= -->
  <rect x="70" y="90" width="190" height="360" rx="10" fill="#2f3640" stroke="#1a1d21" stroke-width="2"/>
  <rect x="120" y="100" width="90" height="70" rx="4" fill="#5a6470"/>
  <text x="128" y="142" class="pin" fill="#e8e8e8" font-size="12">ESP32-WROOM</text>
  <rect x="132" y="410" width="66" height="30" rx="3" fill="#1a1d21"/>
  <text x="141" y="430" class="pin" fill="#9aa4b0" font-size="11">USB</text>

  <text x="96" y="84" class="sub" font-size="11">power-pin edge</text>

  <!-- left header pins (the power edge) -->
  <g>
    <!-- VIN -->
    <circle cx="82" cy="200" r="6" fill="#e74c3c"/>
    <text x="96" y="205" class="pin" fill="#ffb3ab">VIN (5V)</text>
    <!-- GND -->
    <circle cx="82" cy="235" r="6" fill="#2c2c2c" stroke="#888"/>
    <text x="96" y="240" class="pin" fill="#c9c9c9">GND</text>
    <!-- 13 -->
    <circle cx="82" cy="270" r="6" fill="#27ae60"/>
    <text x="96" y="275" class="pin" fill="#a9e8c4">GPIO13</text>
    <!-- 12 -->
    <circle cx="82" cy="305" r="6" fill="#7f8c8d"/>
    <text x="96" y="310" class="pin" fill="#95a5a6">GPIO12  ✗ do not use</text>
    <!-- 14 -->
    <circle cx="82" cy="340" r="6" fill="#2980b9"/>
    <text x="96" y="345" class="pin" fill="#a8d4f0">GPIO14</text>
    <!-- 27 -->
    <circle cx="82" cy="375" r="6" fill="#f39c12"/>
    <text x="96" y="380" class="pin" fill="#f7d9a0">GPIO27</text>
  </g>

  <!-- ================= MAX7219 module ================= -->
  <rect x="560" y="130" width="200" height="270" rx="8" fill="#0f5132" stroke="#0a3d26" stroke-width="2"/>
  <text x="588" y="118" class="lbl">MAX7219 4-in-1</text>
  <text x="596" y="418" class="sub">32 × 8 pixels</text>

  <!-- LED grid -->
  <g fill="#1c1c1c" stroke="#c0392b" stroke-width="0.6">
    <g>
      <rect x="574" y="150" width="172" height="52" fill="#141414" stroke="#083d20"/>
      <rect x="574" y="210" width="172" height="52" fill="#141414" stroke="#083d20"/>
      <rect x="574" y="270" width="172" height="52" fill="#141414" stroke="#083d20"/>
      <rect x="574" y="330" width="172" height="52" fill="#141414" stroke="#083d20"/>
    </g>
  </g>
  <g fill="#e74c3c" opacity="0.55">
    <circle cx="586" cy="162" r="2.6"/><circle cx="606" cy="162" r="2.6"/><circle cx="626" cy="162" r="2.6"/>
    <circle cx="646" cy="162" r="2.6"/><circle cx="666" cy="162" r="2.6"/><circle cx="686" cy="162" r="2.6"/>
    <circle cx="586" cy="222" r="2.6"/><circle cx="626" cy="222" r="2.6"/><circle cx="666" cy="222" r="2.6"/>
    <circle cx="586" cy="282" r="2.6"/><circle cx="646" cy="282" r="2.6"/><circle cx="706" cy="282" r="2.6"/>
    <circle cx="586" cy="342" r="2.6"/><circle cx="666" cy="342" r="2.6"/>
  </g>

  <!-- module input header, left side of module -->
  <g>
    <circle cx="548" cy="170" r="6" fill="#e74c3c"/><text x="500" y="174" class="pin" text-anchor="end">VCC</text>
    <circle cx="548" cy="205" r="6" fill="#2c2c2c" stroke="#888"/><text x="500" y="209" class="pin" text-anchor="end">GND</text>
    <circle cx="548" cy="240" r="6" fill="#27ae60"/><text x="500" y="244" class="pin" text-anchor="end">DIN</text>
    <circle cx="548" cy="275" r="6" fill="#f39c12"/><text x="500" y="279" class="pin" text-anchor="end">CS</text>
    <circle cx="548" cy="310" r="6" fill="#2980b9"/><text x="500" y="314" class="pin" text-anchor="end">CLK</text>
  </g>

  <!-- ================= wires ================= -->
  <!-- VIN -> VCC -->
  <path class="wire" stroke="#e74c3c" d="M 82 200 L 40 200 L 40 60 L 790 60 L 790 170 L 548 170"/>
  <!-- GND -> GND -->
  <path class="wire" stroke="#666666" d="M 82 235 L 28 235 L 28 476 L 800 476 L 800 205 L 548 205"/>
  <!-- 13 -> DIN -->
  <path class="wire" stroke="#27ae60" d="M 82 270 L 54 270 L 54 462 L 786 462 L 786 240 L 548 240"/>
  <!-- 27 -> CS -->
  <path class="wire" stroke="#f39c12" d="M 82 375 L 300 375 L 300 275 L 548 275"/>
  <!-- 14 -> CLK -->
  <path class="wire" stroke="#2980b9" d="M 82 340 L 330 340 L 330 310 L 548 310"/>

  <!-- ================= table ================= -->
  <g transform="translate(300, 120)">
    <text x="0" y="0" class="lbl" font-weight="bold">Connections</text>
    <text x="0" y="22" class="pin">VIN  (5V) ──── VCC</text>
    <text x="0" y="40" class="pin">GND ───────── GND</text>
    <text x="0" y="58" class="pin">GPIO13 ────── DIN</text>
    <text x="0" y="76" class="pin">GPIO14 ────── CLK</text>
    <text x="0" y="94" class="pin">GPIO27 ────── CS</text>
  </g>

  <!-- warnings -->
  <g transform="translate(300, 245)">
    <rect x="-8" y="-16" width="210" height="96" rx="6" fill="#fff8e1" stroke="#f0c36d"/>
    <text x="0" y="0" class="note" font-weight="bold">Watch out</text>
    <text x="0" y="18" class="note">GPIO12 is a strapping pin —</text>
    <text x="0" y="32" class="note">high at boot selects 1.8V flash</text>
    <text x="0" y="46" class="note">and the board won't start.</text>
    <text x="0" y="64" class="note">Use 5V (VIN), not 3V3, for VCC.</text>
  </g>
</svg>
